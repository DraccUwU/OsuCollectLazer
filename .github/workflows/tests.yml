name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the floor the app claims to support, and a current release
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: collection.db writer/reader (byte-exact vs ppy/osu's fixture)
        run: python tests/test_collectiondb.py
      - name: import plumbing (helper gate, request validation)
        run: python tests/test_lazerdb.py
