name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: collection.db writer/reader (byte-exact vs ppy/osu's fixture)
        run: python tests/test_collectiondb.py
      - name: lazer import-log watcher
        run: python tests/test_importlog.py
