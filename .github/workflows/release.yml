name: release

# Tagging v1.0.0 (or pushing any v* tag) publishes two assets:
#   * OsuCollectLazer-win-x64.zip — the frozen app; no Python needed
#   * LazerDb-win-x64.zip         — the import helper, self-contained; no .NET needed
# The first-run wizard downloads the helper asset by that exact name, so the two jobs
# and app/version.py have to agree on it (tests/test_setup.py enforces that).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: publish the import helper (self-contained, win-x64)
        run: dotnet publish tools/LazerDb/LazerDb.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o staging
      # osu.Game.Resources.dll is 128 MB of fonts, textures and audio for lazer's own UI.
      # The headless import never loads it: version check, realm read and a real map import
      # into a copied realm all pass without it, and it is most of the download size.
      - name: drop lazer's resource assembly (128 MB the headless import never touches)
        run: |
          if (Test-Path staging/osu.Game.Resources.dll) { Remove-Item staging/osu.Game.Resources.dll -Force; Write-Host "removed osu.Game.Resources.dll" }
          else { Write-Host "osu.Game.Resources.dll not present - nothing to drop" }
      - name: zip the helper
        run: Compress-Archive -Path staging/* -DestinationPath LazerDb-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: helper
          path: LazerDb-win-x64.zip

  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install PyInstaller and the window toolkit
        run: python -m pip install --upgrade pip pyinstaller pywebview
      - name: freeze the app (folder build - what the installer and the portable zip use)
        run: python -m PyInstaller --noconfirm --distpath dist-portable packaging/OsuCollectLazer.spec
      - name: freeze the single-file build
        run: python -m PyInstaller --noconfirm --distpath dist-single packaging/OsuCollectLazer-onefile.spec
      - name: add the docs to the folder that gets zipped
        run: Copy-Item README.md, LICENSE dist-portable/OsuCollectLazer/
      - name: zip the portable build
        run: Compress-Archive -Path dist-portable/OsuCollectLazer -DestinationPath OsuCollectLazer-win-x64.zip
      - name: install Inno Setup (pinned, so the compiler version cannot drift)
        run: |
          curl.exe -sSL -o innosetup.exe https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
          Start-Process -FilePath .\innosetup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait
      - name: build the installer, version read from app/version.py
        run: |
          $version = (python -c "from app import version; print(version.__version__)").Trim()
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "/DSourceDir=..\dist-portable\OsuCollectLazer" packaging\installer.iss
      - name: collect the four things people download
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item dist-single\OsuCollectLazer.exe out\OsuCollectLazer.exe
          Copy-Item dist-installer\OsuCollectLazer-Setup.exe out\OsuCollectLazer-Setup.exe
          Copy-Item OsuCollectLazer-win-x64.zip out\
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: out/*

  publish:
    needs: [helper, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          body: |
            **Which download?**

            * `OsuCollectLazer-Setup.exe` — recommended: installs per user (no admin prompt),
              adds Start-menu and desktop shortcuts, and uninstalls cleanly. Starts instantly.
            * `OsuCollectLazer-win-x64.zip` — portable: unzip anywhere and run the exe. Same
              instant start. Good for a USB stick.
            * `OsuCollectLazer.exe` — a single file, nothing to unzip. It unpacks itself into
              `%TEMP%` on *every* launch, so with real-time antivirus enabled the first window
              can take a minute or more. Use it when one file matters more than start-up time.
            * `LazerDb-win-x64.zip` — the import helper. The app's setup wizard fetches this
              itself on first run, so you only need it by hand on a machine without internet.

            First run: a setup wizard finds osu!lazer, installs the helper (~70 MB, one time)
            and asks where downloads should go. No Python, no .NET.
          files: |
            OsuCollectLazer-Setup.exe
            OsuCollectLazer.exe
            OsuCollectLazer-win-x64.zip
            LazerDb-win-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
